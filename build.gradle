    systemProperty "OVERSEAS_MIN_MARKET_CAPITAL", "100000000"
    systemProperty "openapi.rest.transaction-id.domestic.sell-order", "VTTC0801U"
    systemProperty "openapi.rest.transaction-id.overseas.stock-balance-find", "VTTS3012R"
    systemProperty "TEST_DISCD_WEBHOOK_URL", "https://discord.com/api/webhooks/33333333333333/test"
