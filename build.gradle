plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.devspacehub'
version = '0.4.1'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

// Querydsl option
def querydslDir = "${project.buildDir}/generated/querydsl"

sourceSets {
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

clean.doLast {
    file(querydslDir).deleteDir()
}

test {
    systemProperty "DB_URL", "jdbc:mysql://35.222.95.13:3306/astDB_BETA?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    systemProperty "DB_USERNAME", "devSpaceHub_BETA"
    systemProperty "DB_PASSWORD", "devSpaceHub_BETA123"
    systemProperty "COMPREHENSIVE_ACCOUNTNUMBER", "50099723"
    systemProperty "ACCOUNTNUMBER_PRODUCT_CODE", "01"
    systemProperty "APP_KEY", "TEST"
    systemProperty "APP_SECRET", "TEST"
    systemProperty "MAX_PBR", "5.0"
    systemProperty "MAX_PER", "100.0"
    systemProperty "MIN_MARKET_CAPITAL", "300000000000"
    systemProperty "MIN_ACCUMULATION_TRADING_VOLUME", "100000"
    systemProperty "CASH_BUY_ORDER_AMOUNT_PERCENT", "10"
    systemProperty "SPLIT_BUY_PERCENTS_BY_COMMA", "5,8,10"
    systemProperty "SPLIT_BUY_COUNT", "3"
    systemProperty "STOP_LOSS_SELL_RATIO", "-5.0"
    systemProperty "PROFIT_SELL_RATIO", "5.0"
